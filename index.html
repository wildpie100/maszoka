<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mászóterv">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>html{-webkit-text-size-adjust:100%;color-scheme:light}body{margin:0}</style>
<title>Mászóterv</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
  /* Elrendezés: egy keskeny oszlop. Felül fül-sor, alatta a nézet, alul rögzített stopper.
     Csak fekete-fehér: az állapotot kitöltés, körvonal és szaggatott vonal különbözteti meg. */
  :root {
    --bg: #FFFFFF;
    --fg: #000000;
    --mute: #6B6B6B;
    --line: #D4D4D4;
    --soft: #F2F2F2;
    --font-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #000000; --fg: #FFFFFF; --mute: #A0A0A0; --line: #2E2E2E; --soft: #141414; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #000000; --fg: #FFFFFF; --mute: #A0A0A0; --line: #2E2E2E; --soft: #141414; color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
    padding-block: 16px 260px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  h2, h3, p { margin: 0; }
  .mono { font-family: var(--font-mono); }

  #view { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .mark { font-family: var(--font-mono); font-size: 13px; letter-spacing: .02em; }
  .tabs { display: flex; gap: 16px; }
  .tabs button { font-size: 14px; padding: 6px 0; border-bottom: 2px solid transparent; color: var(--mute); }
  .tabs button[aria-pressed="true"] { color: var(--fg); border-bottom-color: var(--fg); font-weight: 600; }

  .weeks { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
  .wk { flex: 0 0 auto; min-width: 54px; padding: 6px 8px; border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; line-height: 1.15; }
  .wk b { font-family: var(--font-mono); font-weight: 500; font-size: 16px; }
  .wk span { font-size: 11px; color: var(--mute); }
  .wk[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
  .wk[aria-pressed="true"] span { color: var(--bg); opacity: .75; }
  .wkinfo { color: var(--mute); font-size: 13px; }

  .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .dy { border: 1px solid var(--line); padding: 6px 0 5px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
  .dy span { font-size: 11px; color: var(--mute); }
  .dy b { font-family: var(--font-mono); font-weight: 500; font-size: 14px; }
  .dy i { width: 4px; height: 4px; border-radius: 50%; background: transparent; }
  .dy i.on { background: var(--fg); }
  .dy[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
  .dy[aria-pressed="true"] span { color: var(--bg); opacity: .75; }
  .dy[aria-pressed="true"] i.on { background: var(--bg); }
  .dy.drop { outline: 2px dashed var(--fg); outline-offset: 1px; }

  .dayhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .dayhead h2 { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
  .dayhead span { color: var(--mute); font-size: 13px; }
  .bar { height: 4px; background: var(--soft); }
  .bar i { display: block; height: 100%; background: var(--fg); width: 0; transition: width .2s; }
  .prog { display: flex; justify-content: space-between; font-size: 12px; color: var(--mute); font-family: var(--font-mono); }
  .toolrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

  .btn { padding: 9px 14px; border: 1px solid var(--fg); font-weight: 500; font-size: 14px; }
  .btn.fill { background: var(--fg); color: var(--bg); }
  .btn.sm { padding: 5px 10px; font-size: 13px; }
  .link { text-decoration: underline; color: var(--mute); font-size: 13px; padding: 4px 0; }
  .inp, select.inp, textarea.inp {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg);
    font: inherit; font-size: 16px; border-radius: 0; appearance: none; -webkit-appearance: none;
  }
  select.inp { background-image: linear-gradient(45deg, transparent 50%, var(--fg) 50%), linear-gradient(135deg, var(--fg) 50%, transparent 50%); background-position: calc(100% - 16px) 55%, calc(100% - 11px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
  textarea.inp { min-height: 64px; resize: vertical; }
  .inp::placeholder { color: var(--mute); }

  #blocks { display: flex; flex-direction: column; gap: 8px; }
  .blk { border: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--bg); }
  .blk.done { border-color: var(--fg); }
  .blk.dragging { opacity: .45; border-style: dashed; border-color: var(--fg); }
  .bh { display: flex; align-items: center; gap: 10px; }
  .bt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .bt h3 { font-size: 16px; font-weight: 600; text-wrap: balance; }
  .cat { font-family: var(--font-mono); font-size: 11px; color: var(--mute); text-transform: uppercase; letter-spacing: .06em; }
  .ok { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; border: 1px solid var(--fg); padding: 2px 6px; }
  .grip { width: 32px; height: 36px; flex: 0 0 32px; border: 1px solid var(--line); font-size: 18px; line-height: 1; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
  .spec { font-family: var(--font-mono); font-size: 17px; font-weight: 500; }
  .meta, .note { color: var(--mute); font-size: 13px; }
  .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(68px, 1fr)); gap: 6px; }
  .chip { border: 1px solid var(--line); min-height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; padding: 4px; }
  .chip b { font-family: var(--font-mono); font-weight: 500; font-size: 18px; }
  .chip i { font-style: normal; font-family: var(--font-mono); font-size: 11px; color: var(--mute); min-height: 13px; }
  .chip.on { background: var(--fg); border-color: var(--fg); color: var(--bg); }
  .chip.on i { color: var(--bg); opacity: .8; }
  .checks { display: flex; flex-direction: column; gap: 6px; }
  .rowc { display: flex; align-items: center; gap: 10px; text-align: left; padding: 9px 10px; border: 1px solid var(--line); }
  .rowc .box { flex: 0 0 18px; height: 18px; border: 2px solid var(--fg); display: grid; place-items: center; font-size: 12px; line-height: 1; }
  .rowc.on .box { background: var(--fg); color: var(--bg); }
  .rowc.on .txt { text-decoration: line-through; color: var(--mute); }

  .form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding-top: 6px; border-top: 1px solid var(--line); }
  .form label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--mute); min-width: 0; }
  .form .full { grid-column: 1 / -1; }
  .form .chk { flex-direction: row; align-items: center; gap: 8px; color: var(--fg); font-size: 14px; }
  .form .chk input { width: 20px; height: 20px; accent-color: var(--fg); }
  .form .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .addrow { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .addrow span { font-size: 12px; color: var(--mute); }

  .sec { font-size: 18px; font-weight: 700; }
  .lbl { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--mute); }
  .rep { display: flex; flex-direction: column; gap: 12px; }
  .rr { display: flex; flex-direction: column; gap: 5px; }
  .rr .rl { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .rr .rl b { font-weight: 600; }
  .rr .rl span { font-family: var(--font-mono); font-size: 12px; color: var(--mute); }
  .meter { height: 10px; border: 1px solid var(--fg); }
  .meter i { display: block; height: 100%; background: var(--fg); }
  .scroll { overflow-x: auto; }
  table.mx { border-collapse: collapse; min-width: 100%; font-size: 13px; }
  .mx th, .mx td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
  .mx th:first-child, .mx td:first-child { text-align: left; position: sticky; left: 0; background: var(--bg); }
  .mx th { font-family: var(--font-mono); font-weight: 400; color: var(--mute); }
  .mx td b { font-family: var(--font-mono); font-weight: 500; display: block; }
  .mx td u { display: block; height: 3px; background: var(--fg); text-decoration: none; margin-top: 2px; }
  .mx td.cur, .mx th.cur { background: var(--soft); }
  .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .list li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .list li span { font-family: var(--font-mono); font-size: 12px; color: var(--mute); }
  .pie { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
  .pie svg { flex: 0 0 auto; max-width: 100%; height: auto; }
  .leg { flex: 1 1 190px; min-width: 0; }
  .lg { display: flex; align-items: center; gap: 8px; }
  .sw { width: 20px; height: 20px; flex: 0 0 20px; }
  .chart { width: 100%; height: auto; display: block; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

  .timer {
    --tb: var(--bg); --tf: var(--fg);
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--tb); color: var(--tf); border-top: 2px solid var(--fg);
    padding-top: 10px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .timer[data-phase="work"] { --tb: var(--fg); --tf: var(--bg); border-top-color: var(--bg); }
  .timer[data-phase="prep"] { border-top-style: dashed; }
  .timer.flash { box-shadow: inset 0 0 0 5px var(--tf); }
  .t-in { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
  .t-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .t-label { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; min-width: 0; }
  .t-next { font-size: 12px; opacity: .7; text-align: right; }
  .t-time { font-family: var(--font-mono); font-weight: 500; font-size: 60px; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .t-ctl { display: flex; gap: 6px; flex-wrap: wrap; align-items: stretch; }
  .t-ctl button { flex: 1 1 0; min-width: 62px; padding: 10px 6px; border: 1px solid var(--tf); font-size: 14px; font-weight: 500; }
  .t-ctl button.main { background: var(--tf); color: var(--tb); }
  .t-form { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 100%; }
  .t-form .inp { border-color: var(--tf); background: transparent; color: var(--tf); }
  .t-form .inp option { color: #000; background: #fff; }
  .t-form button { padding: 10px 6px; border: 1px solid var(--tf); font-weight: 500; }
  .t-form button.main { background: var(--tf); color: var(--tb); }
  @media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <span class="mark">mászóterv</span>
    <nav class="tabs" id="tabs">
      <button type="button" data-tab="train" aria-pressed="true">Edzés</button>
      <button type="button" data-tab="report" aria-pressed="false">Kimutatás</button>
      <button type="button" data-tab="settings" aria-pressed="false">Beállítás</button>
    </nav>
  </div>
  <main id="view"></main>
</div>

<div class="timer" id="timer" data-phase="idle">
  <div class="t-in">
    <div class="t-top"><div class="t-label" id="tLabel">Stopper</div><div class="t-next" id="tNext"></div></div>
    <div class="t-time" id="tTime">0:00</div>
    <div class="t-ctl" id="tCtl"></div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var KEY = 'mt-app-v2';
  var DAYK = ['hetfo', 'kedd', 'szerda', 'csutortok', 'pentek', 'szombat', 'vasarnap'];
  var DAYN = ['Hétfő', 'Kedd', 'Szerda', 'Csütörtök', 'Péntek', 'Szombat', 'Vasárnap'];
  var DAYS = ['H', 'K', 'Sz', 'Cs', 'P', 'Szo', 'V'];
  var MONTHS = ['jan.', 'febr.', 'márc.', 'ápr.', 'máj.', 'jún.', 'júl.', 'aug.', 'szept.', 'okt.', 'nov.', 'dec.'];
  var CATS = [['aerob', 'Aerob'], ['anaerob', 'Anaerob'], ['max', 'Max erő'], ['kond', 'Kondíció'], ['ujj', 'Ujj'], ['none', 'Nem számít']];
  var KINDS = [['hang', 'Hang (időzített függés)'], ['sets', 'Szettek'], ['time', 'Idő (perc)'], ['check', 'Lista']];

  function $(id) { return document.getElementById(id); }
  function uid() { return Math.random().toString(36).slice(2, 10); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function mmss(ms, floor) { var s = Math.max(0, floor ? Math.floor(ms / 1000) : Math.ceil(ms / 1000)); var m = Math.floor(s / 60), r = s % 60; return m + ':' + (r < 10 ? '0' : '') + r; }
  function catName(c) { for (var i = 0; i < CATS.length; i++) if (CATS[i][0] === c) return CATS[i][1]; return 'Nem számít'; }

  /* ---------- kiinduló terv ---------- */
  function B(o) {
    var b = { id: uid(), cat: 'none', kind: 'sets', name: '', sets: 3, reps: '', work: 10, rest: 180, minutes: 15, perHand: false, note: '', items: [] };
    for (var k in o) b[k] = o[k];
    return b;
  }
  var P = {
    hang: [4, 5, 5, 3, 5, 5, 3, 2],
    grip: ['félig zárt', 'nyitott', 'félig zárt', 'nyitott', 'félig zárt', 'nyitott', 'félig zárt', 'félig zárt'],
    load: ['~80%, 2–3 s tartalék', '~80%, 2–3 s tartalék', '~80%, +2,5%', '~80%, a 2. heti terhelés', '~80%, +2,5%', '~80%, +2,5%', '~80%', '~80%'],
    pull: [3, 4, 4, 2, 4, 4, 2, 0],
    pullNote: ['2 ismétlés tartalékkal', '2 ismétlés tartalékkal', '2 ismétlés tartalékkal', '2 ismétlés tartalékkal', '2 ismétlés tartalékkal, +1–2 kg', '2 ismétlés tartalékkal', '2 ismétlés tartalékkal', ''],
    b44: [3, 4, 4, 2, 4, 4, 2, 0],
    b44n: [4, 4, 4, 4, 5, 4, 4, 0],
    b44rest: [240, 240, 180, 240, 180, 180, 240, 0],
    b44note: ['6B+–6C. Cél: a 2. szettre 6/10, a 4.-re 8/10 pumpa.', '6B+–6C. Cél: a 2. szettre 6/10, a 4.-re 8/10 pumpa.', '6B+–6C, rövidebb pihenő.', '6B+–6C, könnyítő hét.', '6B+–6C, 5 boulder szettenként.', 'Egy fokkal nehezebb, mint eddig.', '6B+–6C, csúcsolás.', ''],
    one: [2, 2, 3, 2, 3, 3, 2, 0],
    less: [0, 0, 0, 0, 1, 1, 0, 0],
    easy: [15, 20, 20, 15, 20, 20, 15, 20],
    info: ['Ín-bemelegítő hét: az egykezes munka csak 2 szett.', 'Építés.', 'Építés, a 4×4 pihenője 3 perc.', 'Könnyítő hét: kevesebb szett, ugyanaz a terhelés.', 'Építés, a segítséget csökkentsd.', 'Építés, a 4×4 egy fokkal nehezebb.', 'Csúcsolás: az erőmunka fele, a projekt a fő.', 'Csúcsolás és teszt: hétfőn egykezes próba.']
  };
  var PRE = ['Külső rotáció szalaggal, 2×15 oldalanként', 'Face pull vagy band pull-apart, 2×15', 'Y-emelés, 2×10', 'Lassú fekvőtámasz lapocka-kiemeléssel, 2×12', 'Csukló-extenzor és ujjtágító gumival, 2×20'];

  function seedWeek(w) {
    var d = {};
    DAYK.forEach(function (k) { d[k] = { label: '', blocks: [] }; });
    d.hetfo.label = 'Kemény'; d.szerda.label = 'Egykezes'; d.csutortok.label = 'Projekt'; d.pentek.label = 'Szabad';
    var m = d.hetfo.blocks;
    m.push(B({ kind: 'time', name: 'Bemelegítés', minutes: 15, note: '5 perc könnyű kardió, vállkörök szalaggal, 10 perc mászás V1-től V4 szintig.' }));
    m.push(B({ kind: 'hang', name: 'Kétkezes submax hang, 20 mm él', cat: 'ujj', sets: P.hang[w], work: 7, rest: 180, note: P.grip[w] + ' fogás, ' + P.load[w] + ', súlyövvel' }));
    if (w === 7) {
      m.push(B({ kind: 'sets', name: 'Egykezes húzódzkodás-próba', cat: 'max', sets: 3, reps: '1 próba', rest: 240, perHand: true, note: 'Tiszta, kipihent próbák. Jegyezd fel, melyik szakaszon akad el.' }));
    } else {
      m.push(B({ kind: 'sets', name: 'Súlyozott húzódzkodás', cat: 'max', sets: P.pull[w], reps: '3 ismétlés', rest: 180, note: P.pullNote[w] }));
      m.push(B({ kind: 'sets', name: '4×4 boulder', cat: 'anaerob', sets: P.b44[w], reps: P.b44n[w] + ' boulder egymás után', rest: P.b44rest[w], note: P.b44note[w] }));
    }
    m.push(B({ kind: 'check', name: 'Prehab (10 perc)', cat: 'kond', items: PRE.slice() }));
    var s = d.szerda.blocks;
    if (w === 7) {
      s.push(B({ kind: 'time', name: 'Pihenő vagy könnyű mászás', cat: 'aerob', minutes: 20, note: 'Pumpa legfeljebb 3/10. Ha fáradt vagy, ez a nap pihenő.' }));
    } else {
      var as = P.less[w] ? ' A segítséget csökkentsd a múlt héthez képest.' : '';
      s.push(B({ kind: 'time', name: 'Bemelegítés', minutes: 15, note: 'Mint hétfőn, de csak V2 szintig.' }));
      s.push(B({ kind: 'hang', name: 'Egykezes submax hang, 20 mm él', cat: 'ujj', sets: P.one[w], work: 7, rest: 180, perHand: true, note: 'Félig zárt, segítséggel (gumiszalag, csiga vagy lábtámasz), a 7 s végén 2–3 s tartalékkal.' + as }));
      s.push(B({ kind: 'sets', name: 'Egykezes negatív', cat: 'max', sets: P.one[w], reps: '2 ismétlés, 6–8 s lefelé', rest: 180, perHand: true, note: 'Segítéssel fel, egy kézzel le a teljes nyújtásig, a 120° körül lassítva.' }));
      s.push(B({ kind: 'sets', name: 'Gumiszalaggal segített egykezes húzás', cat: 'max', sets: P.one[w], reps: '3 ismétlés', rest: 180, perHand: true, note: 'Mélypontról 90°-ig. A segítség hétről hétre csökken.' + as }));
      s.push(B({ kind: 'time', name: 'Könnyű mászás', cat: 'aerob', minutes: P.easy[w], note: 'Folyamatos mászás, pumpa legfeljebb 3/10.' }));
      s.push(B({ kind: 'check', name: 'Prehab (10 perc)', cat: 'kond', items: PRE.slice() }));
    }
    var c = d.csutortok.blocks;
    c.push(B({ kind: 'time', name: 'Bemelegítés', minutes: 20, note: '3–4 könnyű út 6a-tól 7a-ig fokozatosan.' }));

    drag.dropDay = null;
    var sibs = drag.parent.querySelectorAll('.blk:not(.dragging)'), before = null;
    for (var j = 0; j < sibs.length; j++) { var r = sibs[j].getBoundingClientRect(); if (e.clientY < r.top + r.height / 2) { before = sibs[j]; break; } }
    drag.parent.insertBefore(drag.sec, before);
  });
  function endDrag() {
    if (!drag) return;
    clearInterval(autoTimer);
    var d = drag; drag = null;
    d.sec.classList.remove('dragging');
    var dy = day(), blocks = dy.blocks;
    if (d.dropDay !== null && d.dropDay !== S.cur.d) {
      var idx = -1, k;
      for (k = 0; k < blocks.length; k++) if (blocks[k].id === d.id) idx = k;
      if (idx >= 0) { var b = blocks.splice(idx, 1)[0]; week().days[DAYK[d.dropDay]].blocks.push(b); }
    } else {
      var order = [].map.call(d.parent.querySelectorAll('.blk'), function (n) { return n.getAttribute('data-id'); });
      dy.blocks = order.map(function (id) { return blocks.filter(function (b) { return b.id === id; })[0]; }).filter(Boolean);
    }
    save(); render();
  }
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);

  /* ---------- események ---------- */
  function arm(btn) {
    if (btn.getAttribute('data-armed')) { btn.removeAttribute('data-armed'); return true; }
    var old = btn.textContent;
    btn.setAttribute('data-armed', '1'); btn.textContent = btn.getAttribute('data-arm-text') || 'Biztosan?';
    setTimeout(function () { if (btn.getAttribute('data-armed')) { btn.removeAttribute('data-armed'); btn.textContent = old; } }, 3500);
    return false;
  }
  function findBlock(id) { var bl = day().blocks; for (var i = 0; i < bl.length; i++) if (bl[i].id === id) return bl[i]; return null; }
  function addBlock(kind) {
    var base = { hang: { kind: 'hang', name: 'Új hang', cat: 'ujj', sets: 4, work: 10, rest: 180 }, sets: { kind: 'sets', name: 'Új gyakorlat', cat: 'max', sets: 3, reps: '5 ismétlés', rest: 180 }, time: { kind: 'time', name: 'Új időzített blokk', cat: 'aerob', minutes: 20 }, check: { kind: 'check', name: 'Új lista', cat: 'kond', items: ['Első tétel'] } }[kind];
    var b = B(base); day().blocks.push(b); ui.open[b.id] = true; save(); render();
  }
  function copyText(txt) {
    try { if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(txt); } catch (e) {}
    return Promise.reject(new Error('nincs vágólap'));
  }

  document.addEventListener('click', function (ev) {
    var t = ev.target.closest ? ev.target.closest('button') : null;
    if (!t) return;
    if (t.hasAttribute('data-tab')) { ui.tab = t.getAttribute('data-tab'); render(); return; }
    if (t.hasAttribute('data-vol')) { S.vol = +t.getAttribute('data-vol'); save(); render(); unlockAudio(); setTimeout(function () { beep(587, 0.7); }, 120); return; }
    if (t.hasAttribute('data-range')) { ui.range = t.getAttribute('data-range'); render(); return; }
    if (t.hasAttribute('data-w')) { S.cur.w = +t.getAttribute('data-w'); save(); render(); return; }
    if (t.hasAttribute('data-day')) { S.cur.d = +t.getAttribute('data-day'); save(); render(); return; }
    if (t.hasAttribute('data-add')) { addBlock(t.getAttribute('data-add')); return; }
    if (t.hasAttribute('data-t')) { var s = +t.getAttribute('data-t'); startQueue([{ type: s <= 10 ? 'work' : 'rest', label: s <= 10 ? 'Függés' : 'Pihenő', secs: s }]); return; }
    if (t.hasAttribute('data-sw')) { startQueue([{ type: 'sw', up: true, label: 'Stopper' }]); return; }
    if (t.hasAttribute('data-tc')) {
      var c = t.getAttribute('data-tc'), p = curPhase();
      if (c === 'stop') stopTimer(false);
      else if (c === 'skip') nextPhase();
      else if (c === 'plus') { if (T.paused) T.rem += 30000; else T.endAt += 30000; }
      else if (c === 'early') {
        var left = T.paused ? T.rem : T.endAt - Date.now();
        var el = Math.max(0, Math.round(p.secs - left / 1000));
        if (p.onEnd) p.onEnd(el);
        beep(587, 0.5); nextPhase();
      } else if (c === 'pause') {
        if (p && p.up) { if (T.paused) { T.t0 = Date.now(); T.paused = false; } else { T.base += Date.now() - T.t0; T.paused = true; } }
        else if (T.paused) { T.endAt = Date.now() + T.rem; T.paused = false; }
        else { T.rem = T.endAt - Date.now(); T.paused = true; }
        ctl();
      } else if (c === 'swstop') {
        if (!T.paused) { T.base += Date.now() - T.t0; T.paused = true; }
        T.saving = true; ctl(); $('tTime').textContent = mmss(T.base, true);
      } else if (c === 'swcancel') { T.saving = false; T.t0 = Date.now(); T.paused = false; ctl(); }
      else if (c === 'swsave') {
        var secs = Math.round(T.base / 1000);
        S.free.push({ id: uid(), ts: Date.now(), secs: secs, label: ($('swlabel').value || '').trim(), cat: $('swcat').value, c: cyc().id });
        save(); stopTimer(false);
        if (ui.tab === 'report') render();
      }
      return;
    }
    var act = t.getAttribute('data-act');
    if (!act) return;
    var cy = cyc(), sec = t.closest('.blk'), b = sec ? findBlock(sec.getAttribute('data-id')) : null;
    if (act === 'beeptest') { unlockAudio(); setTimeout(function () { beep(440, 0.25); setTimeout(function () { beep(587, 0.7); }, 600); }, 120); return; }
    if (act === 'edit') { ui.edit = !ui.edit; render(); return; }
    if (act === 'open' && b) { ui.open[b.id] = !ui.open[b.id]; render(); return; }
    if (act === 'run' && b) { if (b.kind === 'hang') startHang(b); else startTime(b); return; }
    if (act === 'toggle' && b) {
      var i = +t.getAttribute('data-i'), l = L(b);
      l.d[i] = !l.d[i]; if (!l.d[i]) { l.s[i] = null; if (b.kind === 'time') l.m = 0; } l.t = Date.now(); save(); refreshBlocks();
      if (l.d[i] && b.kind === 'sets') { unlockAudio(); startRest(b); }
      return;
    }
    if (act === 'dup' && b) {
      var cp = JSON.parse(JSON.stringify(b)); cp.id = uid(); cp.name = b.name + ' (másolat)';
      var arr = day().blocks; arr.splice(arr.indexOf(b) + 1, 0, cp); ui.open[cp.id] = true; save(); render(); return;
    }
    if (act === 'del' && b) {
      if (!arm(t)) return;
      var a2 = day().blocks; a2.splice(a2.indexOf(b), 1); delete S.log[b.id]; save(); render(); return;
    }
    if (act === 'resetday') {
      if (!arm(t)) return;
      day().blocks.forEach(function (x) { delete S.log[x.id]; }); save(); render(); return;
    }
    if (act === 'cyc-new') { S.cycles.push({ id: uid(), name: 'Új ciklus', start: cy.start, weeks: [emptyWeek()] }); S.cur = { c: S.cycles.length - 1, w: 0, d: 0 }; save(); render(); return; }
    if (act === 'cyc-copy') {
      var nc = JSON.parse(JSON.stringify(cy)); nc.id = uid(); nc.name = cy.name + ' (másolat)';
      nc.weeks = nc.weeks.map(cloneWeek); S.cycles.push(nc); S.cur = { c: S.cycles.length - 1, w: 0, d: 0 }; save(); render(); return;
    }
    if (act === 'cyc-del') {
      if (S.cycles.length < 2) { ui.msg = 'Az utolsó ciklust nem lehet törölni.'; render(); return; }
      if (!arm(t)) return;
      S.cycles.splice(S.cur.c, 1); S.cur = { c: 0, w: 0, d: 0 }; save(); render(); return;
    }
    if (act === 'wk-copy') {
      var cw = cloneWeek(week());
      if (S.cur.w + 1 < cy.weeks.length) cy.weeks[S.cur.w + 1] = cw; else cy.weeks.push(cw);
      S.cur.w = Math.min(S.cur.w + 1, cy.weeks.length - 1); save(); render(); return;
    }
    if (act === 'wk-add') { cy.weeks.push(emptyWeek()); S.cur.w = cy.weeks.length - 1; save(); render(); return; }
    if (act === 'wk-del') {
      if (cy.weeks.length < 2) { ui.msg = 'Az utolsó hetet nem lehet törölni.'; render(); return; }
      if (!arm(t)) return;
      cy.weeks.splice(S.cur.w, 1); S.cur.w = Math.max(0, S.cur.w - 1); save(); render(); return;
    }
    if (act === 'export') {
      var txt = JSON.stringify(S); var ta = $('datax'); ta.value = txt;
      copyText(txt).then(function () { ui.msg = 'A vágólapra másoltam.'; $('msg').textContent = ui.msg; }, function () { ta.focus(); ta.select(); ui.msg = 'Másold ki a mezőből kézzel.'; $('msg').textContent = ui.msg; });
      return;
    }
    if (act === 'import') {
      if (!arm(t)) return;
      try {
        var obj = JSON.parse($('datax').value);
        if (!obj || obj.v !== 2 || !obj.cycles || !obj.cycles.length) throw new Error('hibás');
        S = migrate(obj); if (!S.log) S.log = {}; if (!S.free) S.free = []; if (!S.cur) S.cur = { c: 0, w: 0, d: 0 };
        save(); ui.msg = 'Betöltve.'; render();
      } catch (e) { ui.msg = 'A mező tartalma nem érvényes adat.'; $('msg').textContent = ui.msg; }
      return;
    }
    if (act === 'reset-all') { if (!arm(t)) return; S = seed(); save(); ui.msg = 'Visszaállítva.'; render(); return; }
  });

  function onField(el, isChange) {
    var d = el.dataset;
    if (d.lk) { var bb = null; day().blocks.forEach(function (x) { if (x.id === d.lk) bb = x; }); if (bb) { var ll = L(bb); ll.load = el.value; if (!ll.t) ll.t = Date.now(); save(); } return; }
    if (d.s === 'exsel') { ui.ex = el.value; render(); return; }
    if (d.f === 'wklabel') { week().label = el.value; save(); return; }
    if (d.f === 'daylabel') { day().label = el.value; save(); return; }
    if (d.s === 'cname') { cyc().name = el.value; save(); return; }
    if (d.s === 'cstart') { if (el.value) { cyc().start = el.value; save(); } return; }
    if (d.s === 'cycsel') { S.cur = { c: +el.value, w: 0, d: 0 }; save(); render(); return; }
    if (d.b) {
      var b = findBlock(d.b); if (!b) return;
      var f = d.f;
      if (f === 'sets' || f === 'work' || f === 'rest' || f === 'minutes') b[f] = Math.max(0, parseInt(el.value, 10) || 0);
      else if (f === 'perHand') b.perHand = el.checked;
      else if (f === 'items') b.items = el.value.split('\n').map(function (x) { return x.trim(); }).filter(Boolean);
      else b[f] = el.value;
      save();
      var sec = el.closest('.blk');
      if (f === 'kind') { if (b.kind === 'check' && !(b.items && b.items.length)) b.items = ['Első tétel']; if (sec) { var wrap = document.createElement('div'); wrap.innerHTML = blockHTML(b); sec.replaceWith(wrap.firstChild); } return; }
      if (sec) {
        sec.querySelector('h3').textContent = b.name || 'Névtelen blokk';
        sec.querySelector('.cat').textContent = catName(b.cat);
        sec.querySelector('.spec').textContent = specText(b);
        var m = sec.querySelector('.meta'); m.textContent = metaText(b); m.hidden = !metaText(b);
        var n = sec.querySelector('.note'); n.textContent = b.note; n.hidden = !b.note;
      }
    }
  }
  document.addEventListener('input', function (ev) { if (ev.target && ev.target.dataset) onField(ev.target, false); });
  document.addEventListener('change', function (ev) {
    var el = ev.target;
    if (el && el.dataset && el.dataset.s === 'cycsel') return;
    if (el && el.dataset && el.dataset.b && (el.dataset.f === 'perHand' || el.dataset.f === 'cat' || el.dataset.f === 'kind')) { /* már kezelte az input esemény */ }
  });

  render();
  showPhase();
})();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
